services:
  postgres:
    image: postgres:16-alpine
    container_name: vdm_postgres
    restart: unless-stopped
    environment:
      # Valeurs requises (jamais de mot de passe faible par défaut) — définies dans .env à la
      # racine (voir .env.example), sinon `docker compose up` échoue immédiatement au lieu de
      # démarrer silencieusement avec des identifiants devinables.
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant — voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant — voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant — voir .env.example}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
