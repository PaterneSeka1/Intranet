services:
  postgres:
    image: postgres:16-alpine
    container_name: vdm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vdm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vdm_password}
      POSTGRES_DB: ${POSTGRES_DB:-vdm_intranet}
    ports:
      - '5434:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vdm_user} -d ${POSTGRES_DB:-vdm_intranet}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
