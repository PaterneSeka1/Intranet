# Configuration Nginx — VDM Intranet
#
# Deux sous-domaines : un pour le frontend Next.js (vdm-web, port 3000), un pour l'API NestJS
# (vdm-api, port 3001, y compris le handshake Socket.IO /socket.io/ utilisé par les namespaces
# /announcements et /notifications — cf. NEXT_PUBLIC_API_URL, lu directement par le navigateur).
#
# Installation :
#   1. Remplacer INTRANET_DOMAIN et API_DOMAIN ci-dessous par les vrais domaines/sous-domaines.
#   2. cp deployment/nginx/vdm-intranet.conf /etc/nginx/sites-available/vdm-intranet.conf
#   3. ln -s /etc/nginx/sites-available/vdm-intranet.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. certbot --nginx -d INTRANET_DOMAIN -d API_DOMAIN   (ajoute automatiquement les blocs SSL
#      et la redirection HTTP -> HTTPS ; les deux server{} ci-dessous démarrent donc volontairement
#      en HTTP simple, certbot les complète après coup).

# --- Frontend (Next.js) ---
server {
    listen 80;
    listen [::]:80;
    server_name INTRANET_DOMAIN;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API (NestJS + Socket.IO) ---
server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;

    client_max_body_size 10m;

    # Exports PDF/Excel (Puppeteer/ExcelJS) : laisser plus de temps qu'une requête API classique.
    proxy_read_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade WebSocket (handshake Socket.IO /socket.io/, polling + websocket transport).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
